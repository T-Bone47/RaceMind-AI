providers = ["python"]

[variables]
PATH = "/root/.local/bin:/app/backend/.venv/bin:$PATH"

[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = [
    "curl -LsSf https://astral.sh/uv/install.sh | sh",
    "cd backend && /root/.local/bin/uv sync --frozen"
]

[start]
cmd = "cd backend && /root/.local/bin/uv run python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT"
