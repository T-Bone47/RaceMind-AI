# Local dev stack. `docker compose up` gets you Postgres + the API.
# The website/desktop apps run outside Docker during development
# (pnpm dev) - they'll get compose services of their own once built.

services:
  postgres:
    image: postgres:16-alpine
    container_name: racemind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: racemind
      POSTGRES_PASSWORD: racemind
      POSTGRES_DB: racemind
    ports:
      - "5432:5432"
    volumes:
      - racemind_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racemind"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: racemind-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://racemind:racemind@postgres:5432/racemind
      SECRET_KEY: dev-secret-change-me-in-production
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  racemind_postgres_data:
